    - ".cortex/skills/aviation-installer/adsb-ingestion/SKILL.md"
    - ".cortex/skills/aviation-installer/flight-schedules/SKILL.md"
    - ".cortex/skills/aviation-installer/derived-analytics/SKILL.md"

aviation-cleanup:
  allowed_relative_refs:
