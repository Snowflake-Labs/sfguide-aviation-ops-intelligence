definition_version: "2"

entities:
  aviation_dashboard:
    type: snowflake-app
    identifier:
      name: AVIATION_DASHBOARD
      database: SNOWFLAKE_APPS
      schema: PUBLIC
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log
          # Build outputs are regenerated by the remote build (see app.yml).
          - dist
          - dist-server
          - "*.tsbuildinfo"
          - push.log
          # Manual-SPCS fallback artifacts: not used by App Runtime.
          - Dockerfile.runtime
          - aviation_dashboard_service.yaml
          - image-versions.env
          - ".dockerignore*"
          - scripts

    query_warehouse: SNOWFLAKE_APPS_QUERY_WH
    build_compute_pool:
      name: SYSTEM_COMPUTE_POOL_CPU
    service_compute_pool:
      name: SYSTEM_COMPUTE_POOL_CPU
    code_workspace: SNOWFLAKE_APPS.PUBLIC.AVIATION_DASHBOARD_CODE
